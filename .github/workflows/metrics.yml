name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes

          # Clean, minimal base (header & repo stats)
          base: header, repositories
          config_timezone: Europe/London
          config_display: columns

          # 3D Contributions Calendar (commit history & streak)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding Habits (commit activity bar charts)
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_from: 100

          # Most Used Languages bar
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 4
          plugin_languages_sections: most-used

          # WakaTime (coding time & languages)
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages
          plugin_wakatime_user: 77007bcb-e151-4114-a620-7398984b89a0
